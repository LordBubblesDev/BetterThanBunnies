name: Upload Release Artifacts

on:
  push:
    tags: [ '*' ]

env:
  BUILD_NUMBER: ${{ github.run_number }}
  JAVA_VERSION: 25
  TAG: ${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'microsoft'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/neofor*
            ~/.gradle/caches/fabric*
            ~/.gradle/caches/modules-*
            ~/.gradle/caches/loom-cache
            .gradle/loom-cache
          key: ${{ runner.os }}-modtooling-${{ hashFiles('**/gradle.properties', '**/build.gradle', '**/settings.gradle', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-modtooling-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build Fabric
        run: ./gradlew :fabric:build -Pmod_version=${{ github.ref_name }} --no-daemon --stacktrace
      - name: Build NeoForge (verbose)
        run: ./gradlew :neoforge:build -Pmod_version=${{ github.ref_name }} --no-daemon --stacktrace --info
      - name: Upload NeoForge failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-failure-diagnostics
          path: |
            neoforge/build/neoForm/**
            build/reports/problems/**
            **/hs_err_pid*.log
          if-no-files-found: ignore
      - name: Publish (GitHub Releases)
        id: publish_github
        uses: Kira-NT/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659
        with:
          github-token: ${{ github.token }}
          version: ${{ env.TAG }}
          files: |
            **/fabric/build/libs/*.jar
            **/neoforge/build/libs/*.jar
